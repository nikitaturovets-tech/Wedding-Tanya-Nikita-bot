<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💒 Таня &amp; Никита — Свадебная стена</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0a0a0a;
      --gold:     #f0c040;
      --gold-dim: #a07820;
      --card-bg:  #181818;
      --text:     #f0ead8;
      --muted:    #888;
      --new:      #f0c040;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Georgia', 'Times New Roman', serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Частицы ── */
    #particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

    /* ══════════════════════════════════════════════
       РЕЖИМ ФОТО
       ══════════════════════════════════════════════ */
    #photo-mode {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
      position: relative;
      z-index: 2;
      transition: opacity 0.6s ease;
    }

    /* Заголовок */
    header {
      text-align: center;
      padding: 14px 20px 6px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: clamp(1.6rem, 3.5vw, 2.6rem);
      letter-spacing: 0.12em;
      color: var(--gold);
      text-shadow: 0 0 30px rgba(240,192,64,0.35);
      animation: glow 4s ease-in-out infinite;
    }

    header p {
      color: var(--muted);
      font-size: clamp(0.65rem, 1.3vw, 0.9rem);
      margin-top: 4px;
      letter-spacing: 0.08em;
    }

    .counter {
      display: inline-block;
      margin-top: 5px;
      background: rgba(240,192,64,0.1);
      border: 1px solid rgba(240,192,64,0.3);
      border-radius: 20px;
      padding: 2px 14px;
      font-size: clamp(0.6rem, 1.1vw, 0.8rem);
      color: var(--gold);
      letter-spacing: 0.05em;
    }

    @keyframes glow {
      0%,100% { text-shadow: 0 0 20px rgba(240,192,64,0.25); }
      50%      { text-shadow: 0 0 50px rgba(240,192,64,0.55), 0 0 80px rgba(240,192,64,0.2); }
    }

    .divider {
      text-align: center;
      color: var(--gold-dim);
      font-size: 0.8rem;
      letter-spacing: 0.4em;
      margin: 3px 0;
    }

    /* Сетка фото */
    #grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 6px 12px 12px;
      flex: 1;
      overflow: hidden;
      align-content: start;
    }

    /* Карточка */
    .card {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      background: var(--card-bg);
      aspect-ratio: 1 / 1;
      animation: cardIn 0.65s cubic-bezier(0.34,1.5,0.64,1) both;
      box-shadow: 0 2px 16px rgba(0,0,0,0.6);
      border: 1px solid #222;
      transition: border-color 0.3s;
    }

    .card.new-card { border-color: var(--gold); }

    .card img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .card .caption {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 28px 8px 6px;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
      display: flex; flex-direction: column; gap: 2px;
    }

    .card .photo-caption {
      color: #ddd;
      font-size: clamp(0.55rem, 1vw, 0.78rem);
      font-style: italic; line-height: 1.2;
    }

    .card .caption-meta {
      display: flex; justify-content: space-between; align-items: center;
    }

    .card .guest-name {
      color: var(--gold);
      font-weight: bold;
      font-size: clamp(0.55rem, 1vw, 0.78rem);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 72%;
    }

    .card .photo-time { color: var(--muted); font-size: 0.72em; }

    .badge-new {
      position: absolute; top: 6px; right: 6px;
      background: var(--gold);
      color: #0a0a0a;
      font-size: 0.58rem; font-weight: bold;
      padding: 2px 7px; border-radius: 20px;
      letter-spacing: 0.04em;
      animation: pulse 1.5s ease infinite;
    }

    @keyframes pulse  { 0%,100%{opacity:1} 50%{opacity:0.5} }
    @keyframes cardIn {
      from { opacity:0; transform: scale(0.82) translateY(14px); }
      to   { opacity:1; transform: scale(1)    translateY(0);    }
    }

    /* Пустое состояние */
    #empty {
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      flex: 1; gap: 14px; color: #555;
    }
    #empty .icon { font-size: 4.5rem; }
    #empty p { font-size: 1rem; letter-spacing: 0.05em; }

    /* Спотлайт */
    #spotlight {
      position: fixed; inset: 0; z-index: 80;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
      opacity: 0; pointer-events: none;
      transition: opacity 0.5s ease;
    }
    #spotlight.active { opacity: 1; pointer-events: auto; }

    #spotlight .sp-inner {
      position: relative;
      max-width: min(84vh, 84vw);
      max-height: min(84vh, 84vw);
      width: 100%; height: 100%;
      border-radius: 14px; overflow: hidden;
      box-shadow: 0 0 0 2px var(--gold),
                  0 8px 60px rgba(240,192,64,0.15);
      animation: spIn 0.55s cubic-bezier(0.34,1.3,0.64,1) both;
    }

    @keyframes spIn {
      from { transform: scale(0.82); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }

    #spotlight img { width:100%; height:100%; object-fit:cover; display:block; }

    #spotlight .sp-caption {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 60px 20px 18px;
      background: linear-gradient(transparent, rgba(0,0,0,0.9));
      text-align: center;
    }

    #spotlight .sp-text {
      color: #e8dcc8;
      font-size: clamp(1.2rem, 3vw, 2.2rem);
      font-style: italic; margin-bottom: 8px;
    }

    #spotlight .sp-name {
      color: var(--gold);
      font-size: clamp(1rem, 2.5vw, 1.7rem);
      font-weight: bold; letter-spacing: 0.08em;
    }

    #spotlight .sp-badge {
      position: absolute; top: 14px; right: 14px;
      background: var(--gold); color: #0a0a0a;
      font-size: 0.75rem; font-weight: bold;
      padding: 3px 12px; border-radius: 20px;
    }

    /* ══════════════════════════════════════════════
       РЕЖИМ КВИЗА
       ══════════════════════════════════════════════ */
    #quiz-mode {
      position: fixed; inset: 0; z-index: 90;
      background: var(--bg);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 60px;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    #quiz-mode.visible {
      display: flex;
      opacity: 1;
    }

    /* Анимация появления блоков квиза */
    @keyframes fadeUp {
      from { opacity:0; transform: translateY(20px); }
      to   { opacity:1; transform: translateY(0); }
    }

    /* Шапка квиза */
    .quiz-header {
      text-align: center;
      margin-bottom: 30px;
      animation: fadeUp 0.5s 0.1s both;
    }

    .quiz-header .q-label {
      font-size: clamp(1rem, 2vw, 1.4rem);
      color: var(--gold-dim);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .quiz-header .q-progress {
      font-size: clamp(1.8rem, 4vw, 3rem);
      font-weight: bold;
      color: var(--gold);
      letter-spacing: 0.06em;
      text-shadow: 0 0 40px rgba(240,192,64,0.4);
    }

    /* Прогресс-бар вопроса */
    .progress-bar {
      width: 100%; max-width: 700px;
      height: 4px;
      background: #222;
      border-radius: 2px;
      margin: 0 auto 28px;
      overflow: hidden;
      animation: fadeUp 0.5s 0.15s both;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold-dim), var(--gold));
      border-radius: 2px;
      transition: width 0.6s ease;
    }

    /* Текст вопроса */
    .quiz-question {
      text-align: center;
      font-size: clamp(1.3rem, 3vw, 2.4rem);
      line-height: 1.35;
      color: var(--text);
      max-width: 860px;
      margin-bottom: 40px;
      animation: fadeUp 0.5s 0.2s both;
    }

    /* Лидерборд во время вопроса */
    .quiz-leaderboard {
      width: 100%; max-width: 620px;
      animation: fadeUp 0.5s 0.3s both;
    }

    .lb-title {
      text-align: center;
      color: var(--gold);
      font-size: clamp(0.9rem, 1.8vw, 1.3rem);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .lb-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 18px;
      margin-bottom: 8px;
      border-radius: 8px;
      background: #111;
      border: 1px solid #222;
      transition: border-color 0.3s, background 0.3s;
      animation: fadeUp 0.4s both;
    }
    .lb-row:nth-child(1) { animation-delay: 0.35s; }
    .lb-row:nth-child(2) { animation-delay: 0.42s; }
    .lb-row:nth-child(3) { animation-delay: 0.49s; }

    .lb-row.gold-row   { border-color: #c8960a; background: #1a1500; }
    .lb-row.silver-row { border-color: #707070; background: #111416; }
    .lb-row.bronze-row { border-color: #804020; background: #140d08; }

    .lb-medal { font-size: 1.4rem; min-width: 28px; text-align: center; }
    .lb-name  { flex: 1; font-size: clamp(0.9rem, 1.8vw, 1.25rem); }

    .lb-score {
      font-size: clamp(0.85rem, 1.6vw, 1.1rem);
      color: var(--gold);
      font-weight: bold;
      white-space: nowrap;
    }

    .lb-spark { color: #f0c040; font-size: 0.9rem; }

    /* Счётчик ответивших */
    .answered-count {
      margin-top: 24px;
      text-align: center;
      color: var(--muted);
      font-size: clamp(0.85rem, 1.6vw, 1.1rem);
      letter-spacing: 0.05em;
      animation: fadeUp 0.5s 0.5s both;
    }

    .answered-count span { color: var(--text); font-weight: bold; }

    /* ── Финальный лидерборд ── */
    #results-mode {
      width: 100%; max-width: 700px;
      text-align: center;
      animation: fadeUp 0.5s 0.1s both;
    }

    .results-title {
      font-size: clamp(2rem, 5vw, 4rem);
      color: var(--gold);
      letter-spacing: 0.1em;
      text-shadow: 0 0 60px rgba(240,192,64,0.5);
      margin-bottom: 8px;
    }

    .results-subtitle {
      color: var(--muted);
      font-size: clamp(0.85rem, 1.5vw, 1.1rem);
      letter-spacing: 0.12em;
      margin-bottom: 36px;
    }

    .results-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 22px;
      margin-bottom: 10px;
      border-radius: 10px;
      background: #111;
      border: 1px solid #222;
      animation: fadeUp 0.4s both;
    }
    .results-row:nth-child(1) { animation-delay: 0.2s; border-color: #c8960a; background: #1a1500; }
    .results-row:nth-child(2) { animation-delay: 0.28s; border-color: #606060; background: #111416; }
    .results-row:nth-child(3) { animation-delay: 0.36s; border-color: #804020; background: #140d08; }
    .results-row:nth-child(n+4) { animation-delay: calc(0.36s + (var(--i) - 3) * 0.06s); }

    .results-medal { font-size: 1.6rem; min-width: 30px; }
    .results-name  { flex: 1; font-size: clamp(1rem, 2vw, 1.4rem); text-align: left; }
    .results-score {
      font-size: clamp(1rem, 2vw, 1.4rem);
      color: var(--gold);
      font-weight: bold;
    }

    .results-thanks {
      margin-top: 36px;
      font-size: clamp(1.2rem, 2.5vw, 2rem);
      color: var(--muted);
      letter-spacing: 0.08em;
      animation: fadeUp 0.5s 0.8s both;
    }

    /* ── Индикатор подключения ── */
    #status-dot {
      position: fixed; bottom: 10px; right: 14px;
      width: 7px; height: 7px; border-radius: 50%;
      background: #3a9; opacity: 0.7; z-index: 200;
    }
    #status-dot.error { background: #e43; }
  </style>
</head>
<body>

<canvas id="particles"></canvas>

<!-- ═══════════════ РЕЖИМ ФОТО ═══════════════ -->
<div id="photo-mode">
  <header>
    <!-- ✏️ Замените имена здесь -->
    <h1>💒 Таня &amp; Никита</h1>
    <p>Пришли фото боту — оно появится на этом экране!</p>
    <div class="counter" id="counter">📸 0 фото</div>
  </header>
  <div class="divider">· · · ♥ · · ·</div>

  <div id="grid"></div>
  <div id="empty">
    <div class="icon">📸</div>
    <p>Фото ещё нет — будь первым!</p>
  </div>
</div>

<!-- Спотлайт — новое фото на весь экран -->
<div id="spotlight">
  <div class="sp-inner">
    <img id="sp-img" src="" alt="">
    <div class="sp-caption">
      <div class="sp-text" id="sp-text"></div>
      <div class="sp-name" id="sp-name"></div>
    </div>
    <div class="sp-badge" id="sp-badge">✨ Новое фото!</div>
  </div>
</div>

<!-- ═══════════════ РЕЖИМ КВИЗА ═══════════════ -->
<div id="quiz-mode">

  <!-- Вопрос (показывается когда active:true, show_results:false) -->
  <div id="question-view" style="width:100%;max-width:800px;display:flex;flex-direction:column;align-items:center;">
    <div class="quiz-header">
      <div class="q-label">🎯 Квиз</div>
      <div class="q-progress" id="q-progress">Вопрос 1 из 10</div>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill" style="width:10%"></div>
    </div>

    <div class="quiz-question" id="quiz-question">
      Загрузка вопроса…
    </div>

    <div class="quiz-leaderboard">
      <div class="lb-title">🏆 Лидеры</div>
      <div id="lb-rows"></div>
    </div>

    <div class="answered-count" id="answered-count">
      Ответили: <span>0</span> из <span>0</span>
    </div>
  </div>

  <!-- Итоги (показывается когда show_results:true) -->
  <div id="results-view" style="display:none;width:100%;max-width:700px;">
    <div id="results-mode">
      <div class="results-title">🏆 Итоги квиза</div>
      <div class="results-subtitle">Спасибо всем участникам!</div>
      <div id="results-rows"></div>
      <div class="results-thanks">🎉 Поздравляем победителей!</div>
    </div>
  </div>

</div>

<div id="status-dot" title="Статус соединения"></div>

<script>
  // ═══════════════════════════════════════════════════════
  // ЧАСТИЦЫ (золотые звёздочки и сердечки)
  // ═══════════════════════════════════════════════════════
  const canvas = document.getElementById('particles');
  const pctx   = canvas.getContext('2d');
  let particles = [];

  function resizeCanvas() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  function drawHeart(ctx, size) {
    ctx.beginPath();
    ctx.moveTo(0, -size * 0.3);
    ctx.bezierCurveTo( size*0.5, -size,  size, -size*0.3,  size*0.5,  size*0.2);
    ctx.bezierCurveTo( size*0.3,  size*0.6, 0,  size*0.85, 0,  size*0.85);
    ctx.bezierCurveTo(0,  size*0.85, -size*0.3,  size*0.6, -size*0.5,  size*0.2);
    ctx.bezierCurveTo(-size, -size*0.3, -size*0.5, -size, 0, -size*0.3);
    ctx.closePath();
  }

  function createParticle() {
    const isHeart = Math.random() > 0.45;
    return {
      x: Math.random() * canvas.width,
      y: -10,
      size:     2.5 + Math.random() * 4,
      speed:    0.35 + Math.random() * 0.6,
      drift:    (Math.random() - 0.5) * 0.45,
      alpha:    0.15 + Math.random() * 0.3,
      rot:      Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.018,
      isHeart,
      color: isHeart
        ? `rgba(240,192,64,1)`
        : `rgba(255,220,120,1)`,
    };
  }

  for (let i = 0; i < 35; i++) {
    const p = createParticle();
    p.y = Math.random() * canvas.height;
    particles.push(p);
  }

  function animateParticles() {
    pctx.clearRect(0, 0, canvas.width, canvas.height);
    if (Math.random() < 0.1) particles.push(createParticle());
    particles = particles.filter(p => p.y < canvas.height + 20);

    for (const p of particles) {
      p.y += p.speed; p.x += p.drift; p.rot += p.rotSpeed;
      pctx.save();
      pctx.globalAlpha = p.alpha;
      pctx.translate(p.x, p.y);
      pctx.rotate(p.rot);
      pctx.fillStyle = p.color;
      if (p.isHeart) {
        drawHeart(pctx, p.size);
      } else {
        pctx.beginPath();
        pctx.arc(0, 0, p.size * 0.4, 0, Math.PI * 2);
      }
      pctx.fill();
      pctx.restore();
    }
    requestAnimationFrame(animateParticles);
  }
  animateParticles();

  // ═══════════════════════════════════════════════════════
  // РЕЖИМ ФОТО — логика
  // ═══════════════════════════════════════════════════════
  const shown          = new Set();
  let   allPhotos      = [];
  let   carouselIdx    = 0;
  let   lastShownFile  = null;
  let   spotlightQueue = [];
  let   spotlightBusy  = false;

  const photoMode  = document.getElementById('photo-mode');
  const grid       = document.getElementById('grid');
  const empty      = document.getElementById('empty');
  const counter    = document.getElementById('counter');
  const spotlight  = document.getElementById('spotlight');
  const spImg      = document.getElementById('sp-img');
  const spText     = document.getElementById('sp-text');
  const spName     = document.getElementById('sp-name');
  const spBadge    = document.getElementById('sp-badge');
  const dot        = document.getElementById('status-dot');

  async function fetchPhotos() {
    try {
      const res = await fetch('/meta');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const photos = await res.json();   // новые первыми
      dot.classList.remove('error');

      if (photos.length === 0) {
        grid.style.display  = 'none';
        empty.style.display = 'flex';
        counter.textContent = '📸 0 фото';
        return;
      }
      grid.style.display  = 'grid';
      empty.style.display = 'none';

      allPhotos = [...photos].reverse();   // старые → новые для карусели

      const newPhotos = photos.filter(p => !shown.has(p.filename));
      newPhotos.forEach(photo => {
        shown.add(photo.filename);
        spotlightQueue.push(photo);
      });
      processSpotlight();

      newPhotos.forEach(photo => {
        const card = buildCard(photo, true);
        grid.prepend(card);
      });
      while (grid.children.length > 12) grid.removeChild(grid.lastChild);
      counter.textContent = '📸 ' + photos.length + ' фото';

    } catch (err) {
      console.error('Ошибка /meta:', err);
      dot.classList.add('error');
    }
  }

  function processSpotlight() {
    if (spotlightBusy || allPhotos.length === 0) return;
    spotlightBusy = true;

    let photo, isNew;
    if (spotlightQueue.length > 0) {
      photo = spotlightQueue.shift(); isNew = true;
    } else {
      const n = allPhotos.length;
      if (n > 1 && allPhotos[carouselIdx % n].filename === lastShownFile) carouselIdx++;
      photo = allPhotos[carouselIdx++ % n]; isNew = false;
    }
    showSpotlight(photo, isNew, () => { spotlightBusy = false; processSpotlight(); });
  }

  function showSpotlight(photo, isNew, onDone) {
    lastShownFile = photo.filename;
    spImg.src  = '/photo/' + encodeURIComponent(photo.filename);
    spText.textContent = photo.caption ? '«' + photo.caption + '»' : '';
    spName.textContent = photo.name + ' · ' + photo.time;
    spBadge.style.display = isNew ? '' : 'none';
    spotlight.classList.add('active');
    setTimeout(() => {
      spotlight.classList.remove('active');
      setTimeout(onDone, 600);
    }, 8000);
  }

  function buildCard(photo, isNew) {
    const card = document.createElement('div');
    card.className = 'card' + (isNew ? ' new-card' : '');
    card.dataset.filename = photo.filename;

    const img = document.createElement('img');
    img.src = '/photo/' + encodeURIComponent(photo.filename);
    img.alt = 'Фото от ' + photo.name;
    img.loading = 'lazy';

    const cap = document.createElement('div');
    cap.className = 'caption';

    if (photo.caption) {
      const ct = document.createElement('div');
      ct.className = 'photo-caption';
      ct.textContent = '«' + photo.caption + '»';
      cap.appendChild(ct);
    }

    const meta = document.createElement('div');
    meta.className = 'caption-meta';
    const ns = document.createElement('span');
    ns.className = 'guest-name';
    ns.textContent = photo.name;
    const ts = document.createElement('span');
    ts.className = 'photo-time';
    ts.textContent = photo.time;
    meta.appendChild(ns); meta.appendChild(ts);
    cap.appendChild(meta);
    card.appendChild(img); card.appendChild(cap);

    if (isNew) {
      const badge = document.createElement('div');
      badge.className = 'badge-new';
      badge.textContent = '✨ Новое';
      card.appendChild(badge);
      setTimeout(() => { badge.remove(); card.classList.remove('new-card'); }, 15000);
    }
    return card;
  }

  // ═══════════════════════════════════════════════════════
  // РЕЖИМ КВИЗА — логика
  // ═══════════════════════════════════════════════════════
  const quizMode      = document.getElementById('quiz-mode');
  const questionView  = document.getElementById('question-view');
  const resultsView   = document.getElementById('results-view');
  const qProgress     = document.getElementById('q-progress');
  const progressFill  = document.getElementById('progress-fill');
  const quizQuestion  = document.getElementById('quiz-question');
  const lbRows        = document.getElementById('lb-rows');
  const answeredCount = document.getElementById('answered-count');
  const resultsRows   = document.getElementById('results-rows');

  // Предыдущее состояние — чтобы не перерисовывать без изменений
  let prevQuizStr   = '';
  // Таймер авто-возврата к фото после /results
  let resultsTimer  = null;

  const MEDALS = ['🥇', '🥈', '🥉'];

  async function fetchQuiz() {
    try {
      const res = await fetch('/quiz');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const state = await res.json();
      const stateStr = JSON.stringify(state);
      if (stateStr === prevQuizStr) return;   // ничего не изменилось
      prevQuizStr = stateStr;
      renderQuiz(state);
    } catch (err) {
      console.error('Ошибка /quiz:', err);
    }
  }

  function renderQuiz(state) {
    const wasActive = !quizMode.classList.contains('visible');

    if (state.active) {
      // ── Режим АКТИВНОГО вопроса ──────────────────────────────────
      clearTimeout(resultsTimer);
      showQuizMode();

      questionView.style.display = 'flex';
      questionView.style.flexDirection = 'column';
      questionView.style.alignItems = 'center';
      resultsView.style.display  = 'none';

      // Прогресс
      const cur = state.current_question || 1;
      const tot = state.total_questions  || 1;
      qProgress.textContent = `Вопрос ${cur} из ${tot}`;
      progressFill.style.width = Math.round(cur / tot * 100) + '%';

      // Вопрос
      quizQuestion.textContent = state.question_text || '';

      // Лидерборд (топ-3)
      const top3 = (state.leaderboard || []).slice(0, 3);
      lbRows.innerHTML = '';
      if (top3.length === 0) {
        lbRows.innerHTML = '<div style="text-align:center;color:#555;padding:12px">Пока нет ответов</div>';
      } else {
        top3.forEach((entry, i) => {
          const rowClass = ['gold-row', 'silver-row', 'bronze-row'][i] || '';
          const answered = entry.total > 0 ? entry.total : cur - 1;
          const isLeader = i === 0 && entry.score === answered && answered > 0;
          lbRows.innerHTML += `
            <div class="lb-row ${rowClass}">
              <span class="lb-medal">${MEDALS[i] || (i + 1) + '.'}</span>
              <span class="lb-name">${escHtml(entry.name)}</span>
              <span class="lb-score">${entry.score} из ${answered}</span>
              ${isLeader ? '<span class="lb-spark">⚡</span>' : ''}
            </div>`;
        });
      }

      // Счётчик ответивших
      const ac = state.answered_count    || 0;
      const tp = state.total_participants || 0;
      answeredCount.innerHTML = `Ответили: <span>${ac}</span> из <span>${tp}</span>`;

    } else if (state.show_results) {
      // ── Режим ИТОГОВ ─────────────────────────────────────────────
      showQuizMode();
      questionView.style.display = 'none';
      resultsView.style.display  = 'block';

      const all = state.leaderboard || [];
      resultsRows.innerHTML = '';
      all.forEach((entry, i) => {
        const medal = MEDALS[i] || `${i + 1}.`;
        resultsRows.innerHTML += `
          <div class="results-row" style="--i:${i + 1}">
            <span class="results-medal">${medal}</span>
            <span class="results-name">${escHtml(entry.name)}</span>
            <span class="results-score">${entry.score} из ${entry.total}</span>
          </div>`;
      });

      // Через 30 секунд плавно вернуться к фото
      clearTimeout(resultsTimer);
      resultsTimer = setTimeout(hideQuizMode, 30000);

    } else {
      // ── Квиз не активен → режим ФОТО ─────────────────────────────
      if (quizMode.classList.contains('visible')) {
        hideQuizMode();
      }
    }
  }

  function showQuizMode() {
    quizMode.style.display = 'flex';
    // Небольшая задержка чтобы transition сработал после display:flex
    requestAnimationFrame(() => quizMode.classList.add('visible'));
    // Спотлайт прячем на время квиза
    spotlight.classList.remove('active');
    spotlightBusy = true;  // останавливаем карусель
  }

  function hideQuizMode() {
    quizMode.classList.remove('visible');
    setTimeout(() => {
      quizMode.style.display = 'none';
      spotlightBusy = false;   // возобновляем карусель
      processSpotlight();
    }, 650);
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ═══════════════════════════════════════════════════════
  // ОПРОСЫ И SSE
  // ═══════════════════════════════════════════════════════

  // Первый запрос сразу
  fetchPhotos();
  fetchQuiz();

  // SSE: мгновенное обновление при новом фото
  function connectSSE() {
    const es = new EventSource('/events');
    es.onmessage = e => { if (e.data === 'refresh') fetchPhotos(); };
    es.onerror   = () => { es.close(); setTimeout(connectSSE, 3000); };
  }
  connectSSE();

  // Резервный опрос каждые 3 секунды
  setInterval(fetchPhotos, 3000);
  setInterval(fetchQuiz,   3000);
</script>
</body>
</html>
