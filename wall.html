<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💒 Таня &amp; Никита — Свадебная стена</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #faf6f0;          /* тёплый кремовый фон */
      --bg2:        #f3ece2;          /* чуть темнее для контраста */
      --gold:       #b07d2a;          /* элегантное тёплое золото */
      --gold-light: #d4a843;          /* светлее для акцентов */
      --gold-dim:   #c9a96e;          /* приглушённое золото */
      --rose:       #c2697a;          /* пыльная роза */
      --rose-light: #e8b4bc;          /* светло-розовый */
      --text:       #2a1f14;          /* тёплый тёмно-коричневый */
      --muted:      #8a7868;          /* приглушённый серо-коричневый */
      --surface:    #ffffff;          /* карточки */
      --border:     #e4d8cc;          /* мягкая граница */
    }

    body {
      background: var(--bg);
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(212,168,67,0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 100%, rgba(194,105,122,0.06) 0%, transparent 60%);
      color: var(--text);
      font-family: 'Cormorant Garamond', 'Georgia', serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Частицы ── */
    #particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

    /* ══════════════════════════════════════════════
       РЕЖИМ ФОТО
       ══════════════════════════════════════════════ */
    #photo-mode {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
      position: relative;
      z-index: 2;
    }

    /* Заголовок */
    header {
      text-align: center;
      padding: 16px 20px 6px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: clamp(1.8rem, 3.8vw, 3rem);
      font-weight: 600;
      letter-spacing: 0.18em;
      color: var(--gold);
      animation: glow 5s ease-in-out infinite;
    }

    header p {
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      color: var(--muted);
      font-size: clamp(0.6rem, 1.2vw, 0.85rem);
      margin-top: 5px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .counter {
      display: inline-block;
      margin-top: 6px;
      background: rgba(176,125,42,0.08);
      border: 1px solid rgba(176,125,42,0.25);
      border-radius: 20px;
      padding: 2px 14px;
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(0.55rem, 1vw, 0.75rem);
      color: var(--gold);
      letter-spacing: 0.06em;
    }

    @keyframes glow {
      0%,100% { text-shadow: 0 1px 12px rgba(176,125,42,0.2); }
      50%      { text-shadow: 0 2px 28px rgba(176,125,42,0.45), 0 0 60px rgba(194,105,122,0.12); }
    }

    .divider {
      text-align: center;
      color: var(--rose-light);
      font-size: 0.8rem;
      letter-spacing: 0.5em;
      margin: 3px 0 1px;
    }

    /* Сетка фото */
    #grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 6px 12px 12px;
      flex: 1;
      overflow: hidden;
      align-content: start;
    }

    /* Карточка */
    .card {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: var(--surface);
      aspect-ratio: 1 / 1;
      animation: cardIn 0.65s cubic-bezier(0.34,1.5,0.64,1) both;
      box-shadow: 0 3px 14px rgba(42,31,20,0.1), 0 1px 4px rgba(42,31,20,0.06);
      border: 1px solid var(--border);
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .card.new-card {
      border-color: var(--rose);
      box-shadow: 0 3px 18px rgba(194,105,122,0.2), 0 1px 4px rgba(42,31,20,0.06);
    }

    .card img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .card .caption {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 28px 8px 7px;
      background: linear-gradient(transparent, rgba(42,31,20,0.72));
      display: flex; flex-direction: column; gap: 2px;
    }

    .card .photo-caption {
      color: rgba(255,248,240,0.9);
      font-size: clamp(0.55rem, 1vw, 0.78rem);
      font-style: italic; line-height: 1.2;
    }

    .card .caption-meta {
      display: flex; justify-content: space-between; align-items: center;
    }

    .card .guest-name {
      color: #fde8c0;
      font-weight: 600;
      font-size: clamp(0.55rem, 1vw, 0.78rem);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 72%;
    }

    .card .photo-time {
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      color: rgba(255,240,220,0.65);
      font-size: 0.68em;
    }

    .badge-new {
      position: absolute; top: 7px; right: 7px;
      background: var(--rose);
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.56rem; font-weight: 500;
      padding: 3px 8px; border-radius: 20px;
      letter-spacing: 0.05em;
      animation: pulse 1.8s ease infinite;
    }

    @keyframes pulse  { 0%,100%{opacity:1} 50%{opacity:0.55} }
    @keyframes cardIn {
      from { opacity:0; transform: scale(0.84) translateY(14px); }
      to   { opacity:1; transform: scale(1)    translateY(0);    }
    }

    /* Пустое состояние */
    #empty {
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      flex: 1; gap: 14px; color: var(--muted);
    }
    #empty .icon { font-size: 4.5rem; }
    #empty p {
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      font-size: 1rem; letter-spacing: 0.08em;
    }

    /* Спотлайт */
    #spotlight {
      position: fixed; inset: 0; z-index: 80;
      display: flex; align-items: center; justify-content: center;
      background: rgba(42,31,20,0.84);
      opacity: 0; pointer-events: none;
      transition: opacity 0.5s ease;
    }
    #spotlight.active { opacity: 1; pointer-events: auto; }

    #spotlight .sp-inner {
      position: relative;
      max-width: min(84vh, 84vw);
      max-height: min(84vh, 84vw);
      width: 100%; height: 100%;
      border-radius: 16px; overflow: hidden;
      box-shadow: 0 0 0 2px var(--rose-light),
                  0 12px 60px rgba(42,31,20,0.5);
      animation: spIn 0.55s cubic-bezier(0.34,1.3,0.64,1) both;
    }

    @keyframes spIn {
      from { transform: scale(0.82); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }

    #spotlight img { width:100%; height:100%; object-fit:cover; display:block; }

    #spotlight .sp-caption {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 60px 20px 20px;
      background: linear-gradient(transparent, rgba(42,31,20,0.88));
      text-align: center;
    }

    #spotlight .sp-text {
      color: #fdf0e0;
      font-size: clamp(1.2rem, 3vw, 2.2rem);
      font-style: italic; margin-bottom: 8px;
    }

    #spotlight .sp-name {
      color: #fde8c0;
      font-size: clamp(1rem, 2.5vw, 1.7rem);
      font-weight: 600; letter-spacing: 0.1em;
    }

    #spotlight .sp-badge {
      position: absolute; top: 14px; right: 14px;
      background: var(--rose); color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.72rem; font-weight: 500;
      padding: 4px 13px; border-radius: 20px;
    }

    /* ══════════════════════════════════════════════
       РЕЖИМ КВИЗА
       ══════════════════════════════════════════════ */
    #quiz-mode {
      position: fixed; inset: 0; z-index: 90;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse at 15% 10%, rgba(212,168,67,0.1) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 90%, rgba(194,105,122,0.08) 0%, transparent 55%);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 60px;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    #quiz-mode.visible { display: flex; opacity: 1; }

    @keyframes fadeUp {
      from { opacity:0; transform: translateY(18px); }
      to   { opacity:1; transform: translateY(0); }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 26px;
      animation: fadeUp 0.5s 0.1s both;
    }

    .quiz-header .q-label {
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      font-size: clamp(0.75rem, 1.5vw, 1rem);
      color: var(--muted);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .quiz-header .q-progress {
      font-size: clamp(1.8rem, 4vw, 3rem);
      font-weight: 600;
      color: var(--gold);
      letter-spacing: 0.06em;
    }

    .progress-bar {
      width: 100%; max-width: 700px;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 28px;
      overflow: hidden;
      animation: fadeUp 0.5s 0.15s both;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold-dim), var(--rose));
      border-radius: 2px;
      transition: width 0.6s ease;
    }

    .quiz-question {
      text-align: center;
      font-size: clamp(1.3rem, 3vw, 2.4rem);
      line-height: 1.4;
      color: var(--text);
      max-width: 860px;
      margin-bottom: 36px;
      animation: fadeUp 0.5s 0.2s both;
    }

    .quiz-leaderboard {
      width: 100%; max-width: 620px;
      animation: fadeUp 0.5s 0.3s both;
    }

    .lb-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 400;
      text-align: center;
      color: var(--gold);
      font-size: clamp(0.75rem, 1.5vw, 1rem);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .lb-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 18px;
      margin-bottom: 8px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: border-color 0.3s;
      animation: fadeUp 0.4s both;
    }
    .lb-row:nth-child(1) { animation-delay: 0.35s; }
    .lb-row:nth-child(2) { animation-delay: 0.42s; }
    .lb-row:nth-child(3) { animation-delay: 0.49s; }

    .lb-row.gold-row   { border-color: var(--gold-dim);  background: #fdf8ee; }
    .lb-row.silver-row { border-color: #c0b0a0;           background: #f8f4f0; }
    .lb-row.bronze-row { border-color: var(--rose-light); background: #fdf2f4; }

    .lb-medal { font-size: 1.4rem; min-width: 28px; text-align: center; }
    .lb-name  { flex: 1; font-size: clamp(0.9rem, 1.8vw, 1.25rem); color: var(--text); }

    .lb-score {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(0.8rem, 1.5vw, 1rem);
      color: var(--gold);
      font-weight: 500;
      white-space: nowrap;
    }

    .lb-spark { color: var(--rose); font-size: 0.9rem; }

    .answered-count {
      margin-top: 22px;
      text-align: center;
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      color: var(--muted);
      font-size: clamp(0.75rem, 1.4vw, 1rem);
      letter-spacing: 0.08em;
      animation: fadeUp 0.5s 0.5s both;
    }

    .answered-count span { color: var(--text); font-weight: 500; }

    /* ── Финальный лидерборд ── */
    #results-mode {
      width: 100%; max-width: 700px;
      text-align: center;
      animation: fadeUp 0.5s 0.1s both;
    }

    .results-title {
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 600;
      color: var(--gold);
      letter-spacing: 0.12em;
      margin-bottom: 6px;
    }

    .results-subtitle {
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      color: var(--muted);
      font-size: clamp(0.75rem, 1.4vw, 1rem);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 32px;
    }

    .results-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 22px;
      margin-bottom: 10px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      animation: fadeUp 0.4s both;
    }
    .results-row:nth-child(1) { animation-delay: 0.2s;  border-color: var(--gold-dim);  background: #fdf8ee; }
    .results-row:nth-child(2) { animation-delay: 0.28s; border-color: #c0b0a0;           background: #f8f4f0; }
    .results-row:nth-child(3) { animation-delay: 0.36s; border-color: var(--rose-light); background: #fdf2f4; }
    .results-row:nth-child(n+4) { animation-delay: calc(0.36s + (var(--i) - 3) * 0.06s); }

    .results-medal { font-size: 1.6rem; min-width: 30px; }
    .results-name  { flex: 1; font-size: clamp(1rem, 2vw, 1.4rem); text-align: left; color: var(--text); }
    .results-score {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(0.9rem, 1.8vw, 1.2rem);
      color: var(--gold);
      font-weight: 500;
    }

    .results-thanks {
      margin-top: 32px;
      font-size: clamp(1.1rem, 2.2vw, 1.8rem);
      color: var(--rose);
      letter-spacing: 0.1em;
      animation: fadeUp 0.5s 0.8s both;
    }

    /* ══════════════════════════════════════════════
       РЕЖИМ СЛАЙДШОУ
       ══════════════════════════════════════════════ */
    #slideshow-mode {
      position: fixed; inset: 0; z-index: 85;
      background: var(--bg2);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.7s ease;
      gap: 28px;
    }
    #slideshow-mode.visible { display: flex; opacity: 1; }

    /* Заголовок над рамкой */
    #slideshow-header {
      text-align: center;
      pointer-events: none;
    }
    #slideshow-title {
      font-size: clamp(1.8rem, 4vw, 3.2rem);
      font-weight: 600;
      color: var(--gold);
      letter-spacing: 0.18em;
      animation: glow 5s ease-in-out infinite;
    }
    #slideshow-subtitle {
      margin-top: 6px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      color: var(--muted);
      font-size: clamp(0.7rem, 1.4vw, 1rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    /* Рамка с фото */
    #slideshow-frame {
      position: relative;
      width: min(88vw, 88vh * 1.6);
      height: min(62vw, 62vh * 1.6);
      max-width: 1400px;
      max-height: 800px;
      border-radius: 18px;
      overflow: hidden;
      box-shadow:
        0 0 0 6px var(--surface),
        0 0 0 9px var(--gold-dim),
        0 12px 48px rgba(42,31,20,0.18);
      background: var(--bg);
    }

    .slide-layer {
      position: absolute; inset: 0;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    .slide-layer.active { opacity: 1; }

    /* Точки под рамкой */
    #slideshow-dots {
      display: flex; gap: 8px;
    }
    .slide-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--border);
      transition: background 0.4s;
    }
    .slide-dot.active { background: var(--gold); }

    /* ── РЕЖИМ ПРЕЗЕНТАЦИИ ── */
    #presentation-mode {
      position: fixed; inset: 0; z-index: 88;
      background: #0a0a0a;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.7s ease;
      gap: 20px;
    }
    #presentation-mode.visible { display: flex; opacity: 1; }

    #presentation-frame {
      position: relative;
      width: min(90vw, 90vh * 1.6);
      height: min(63vw, 63vh * 1.6);
      max-width: 1500px;
      max-height: 850px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.08), 0 20px 60px rgba(0,0,0,0.6);
      background: #111;
    }
    .pres-layer {
      position: absolute; inset: 0;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .pres-layer.active { opacity: 1; }

    #presentation-counter {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.35);
    }
    #presentation-dots {
      display: flex; gap: 7px;
    }
    .pres-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: rgba(255,255,255,0.2);
      transition: background 0.3s;
    }
    .pres-dot.active { background: rgba(255,255,255,0.85); }

    /* ── РЕЖИМ ЗВЁЗДНОЕ НЕБО ── */
    #starsky-mode {
      position: fixed; inset: 0; z-index: 95;
      display: none;
      opacity: 0;
      transition: opacity 1.2s ease;
      background: #000 url('/starry-bg') center/cover no-repeat;
    }
    #starsky-mode.visible { display: block; opacity: 1; }

    /* ── Индикатор подключения ── */
    #status-dot {
      position: fixed; bottom: 10px; right: 14px;
      width: 6px; height: 6px; border-radius: 50%;
      background: #5aaa80; opacity: 0.6; z-index: 200;
    }
    #status-dot.error { background: #c05060; }
  </style>
</head>
<body>

<canvas id="particles"></canvas>

<!-- ═══════════════ РЕЖИМ ФОТО ═══════════════ -->
<div id="photo-mode">
  <header>
    <!-- ✏️ Замените имена здесь -->
    <h1>💒 Таня &amp; Никита</h1>
    <p>Пришли фото боту — оно появится на этом экране!</p>
    <div class="counter" id="counter">📸 0 фото</div>
  </header>
  <div class="divider">· · · ♥ · · ·</div>

  <div id="grid"></div>
  <div id="empty">
    <div class="icon">📸</div>
    <p>Фото ещё нет — будь первым!</p>
  </div>
</div>

<!-- Спотлайт — новое фото на весь экран -->
<div id="spotlight">
  <div class="sp-inner">
    <img id="sp-img" src="" alt="">
    <div class="sp-caption">
      <div class="sp-text" id="sp-text"></div>
      <div class="sp-name" id="sp-name"></div>
    </div>
    <div class="sp-badge" id="sp-badge">✨ Новое фото!</div>
  </div>
</div>

<!-- ═══════════════ РЕЖИМ ПРЕЗЕНТАЦИИ ═══════════════ -->
<div id="presentation-mode">
  <div id="presentation-frame">
    <div class="pres-layer" id="pres-a"></div>
    <div class="pres-layer" id="pres-b"></div>
  </div>
  <div id="presentation-counter"></div>
  <div id="presentation-dots"></div>
</div>

<!-- ═══════════════ РЕЖИМ ЗВЁЗДНОЕ НЕБО ═══════════════ -->
<div id="starsky-mode"></div>

<!-- ═══════════════ РЕЖИМ СЛАЙДШОУ ═══════════════ -->
<div id="slideshow-mode">
  <!-- Заголовок над рамкой -->
  <div id="slideshow-header">
    <div id="slideshow-title">💒 Таня &amp; Никита</div>
    <div id="slideshow-subtitle">05 · 06 · 2026</div>
  </div>

  <!-- Рамка с фото -->
  <div id="slideshow-frame">
    <div class="slide-layer" id="slide-a"></div>
    <div class="slide-layer" id="slide-b"></div>
  </div>

  <!-- Точки-индикаторы -->
  <div id="slideshow-dots"></div>
</div>

<!-- ═══════════════ РЕЖИМ КВИЗА ═══════════════ -->
<div id="quiz-mode">

  <!-- Вопрос (показывается когда active:true, show_results:false) -->
  <div id="question-view" style="width:100%;max-width:800px;display:flex;flex-direction:column;align-items:center;">
    <div class="quiz-header">
      <div class="q-label">🎯 Квиз</div>
      <div class="q-progress" id="q-progress">Вопрос 1 из 10</div>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill" style="width:10%"></div>
    </div>

    <div class="quiz-question" id="quiz-question">
      Загрузка вопроса…
    </div>

    <div class="quiz-leaderboard">
      <div class="lb-title">🏆 Лидеры</div>
      <div id="lb-rows"></div>
    </div>

    <div class="answered-count" id="answered-count">
      Ответили: <span>0</span> из <span>0</span>
    </div>
  </div>

  <!-- Итоги (показывается когда show_results:true) -->
  <div id="results-view" style="display:none;width:100%;max-width:700px;">
    <div id="results-mode">
      <div class="results-title">🏆 Итоги квиза</div>
      <div class="results-subtitle">Спасибо всем участникам!</div>
      <div id="results-rows"></div>
      <div class="results-thanks">🎉 Поздравляем победителей!</div>
    </div>
  </div>

</div>

<div id="status-dot" title="Статус соединения"></div>

<script>
  // ═══════════════════════════════════════════════════════
  // ЧАСТИЦЫ (золотые звёздочки и сердечки)
  // ═══════════════════════════════════════════════════════
  const canvas = document.getElementById('particles');
  const pctx   = canvas.getContext('2d');
  let particles = [];

  function resizeCanvas() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  function drawHeart(ctx, size) {
    ctx.beginPath();
    ctx.moveTo(0, -size * 0.3);
    ctx.bezierCurveTo( size*0.5, -size,  size, -size*0.3,  size*0.5,  size*0.2);
    ctx.bezierCurveTo( size*0.3,  size*0.6, 0,  size*0.85, 0,  size*0.85);
    ctx.bezierCurveTo(0,  size*0.85, -size*0.3,  size*0.6, -size*0.5,  size*0.2);
    ctx.bezierCurveTo(-size, -size*0.3, -size*0.5, -size, 0, -size*0.3);
    ctx.closePath();
  }

  function createParticle() {
    const isHeart = Math.random() > 0.45;
    return {
      x: Math.random() * canvas.width,
      y: -10,
      size:     2.5 + Math.random() * 4,
      speed:    0.35 + Math.random() * 0.6,
      drift:    (Math.random() - 0.5) * 0.45,
      alpha:    0.15 + Math.random() * 0.3,
      rot:      Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.018,
      isHeart,
      color: isHeart
        ? `rgba(240,192,64,1)`
        : `rgba(255,220,120,1)`,
    };
  }

  for (let i = 0; i < 35; i++) {
    const p = createParticle();
    p.y = Math.random() * canvas.height;
    particles.push(p);
  }

  function animateParticles() {
    pctx.clearRect(0, 0, canvas.width, canvas.height);
    if (Math.random() < 0.1) particles.push(createParticle());
    particles = particles.filter(p => p.y < canvas.height + 20);

    for (const p of particles) {
      p.y += p.speed; p.x += p.drift; p.rot += p.rotSpeed;
      pctx.save();
      pctx.globalAlpha = p.alpha;
      pctx.translate(p.x, p.y);
      pctx.rotate(p.rot);
      pctx.fillStyle = p.color;
      if (p.isHeart) {
        drawHeart(pctx, p.size);
      } else {
        pctx.beginPath();
        pctx.arc(0, 0, p.size * 0.4, 0, Math.PI * 2);
      }
      pctx.fill();
      pctx.restore();
    }
    requestAnimationFrame(animateParticles);
  }
  animateParticles();

  // ═══════════════════════════════════════════════════════
  // РЕЖИМ ФОТО — логика
  // ═══════════════════════════════════════════════════════
  const shown          = new Set();
  let   allPhotos      = [];
  let   carouselIdx    = 0;
  let   lastShownFile  = null;
  let   spotlightQueue = [];
  let   spotlightBusy  = false;

  const photoMode  = document.getElementById('photo-mode');
  const grid       = document.getElementById('grid');
  const empty      = document.getElementById('empty');
  const counter    = document.getElementById('counter');
  const spotlight  = document.getElementById('spotlight');
  const spImg      = document.getElementById('sp-img');
  const spText     = document.getElementById('sp-text');
  const spName     = document.getElementById('sp-name');
  const spBadge    = document.getElementById('sp-badge');
  const dot        = document.getElementById('status-dot');

  async function fetchPhotos() {
    try {
      const res = await fetch('/meta');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const photos = await res.json();   // новые первыми
      dot.classList.remove('error');

      if (photos.length === 0) {
        grid.style.display  = 'none';
        empty.style.display = 'flex';
        counter.textContent = '📸 0 фото';
        return;
      }
      grid.style.display  = 'grid';
      empty.style.display = 'none';

      allPhotos = [...photos].reverse();   // старые → новые для карусели

      const newPhotos = photos.filter(p => !shown.has(p.filename));
      newPhotos.forEach(photo => {
        shown.add(photo.filename);
        spotlightQueue.push(photo);
      });
      processSpotlight();

      newPhotos.forEach(photo => {
        const card = buildCard(photo, true);
        grid.prepend(card);
      });
      while (grid.children.length > 12) grid.removeChild(grid.lastChild);
      counter.textContent = '📸 ' + photos.length + ' фото';

    } catch (err) {
      console.error('Ошибка /meta:', err);
      dot.classList.add('error');
    }
  }

  function processSpotlight() {
    if (spotlightBusy || allPhotos.length === 0) return;
    spotlightBusy = true;

    let photo, isNew;
    if (spotlightQueue.length > 0) {
      photo = spotlightQueue.shift(); isNew = true;
    } else {
      const n = allPhotos.length;
      if (n > 1 && allPhotos[carouselIdx % n].filename === lastShownFile) carouselIdx++;
      photo = allPhotos[carouselIdx++ % n]; isNew = false;
    }
    const pause = isNew ? 500 : 4000;  // новое фото — пауза 0.5с, карусель — 4с
    showSpotlight(photo, isNew, () => {
      spotlightBusy = false;
      setTimeout(processSpotlight, pause);
    });
  }

  function showSpotlight(photo, isNew, onDone) {
    lastShownFile = photo.filename;
    spImg.src  = '/photo/' + encodeURIComponent(photo.filename);
    spText.textContent = photo.caption ? '«' + photo.caption + '»' : '';
    spName.textContent = photo.name + ' · ' + photo.time;
    spBadge.style.display = isNew ? '' : 'none';
    spotlight.classList.add('active');
    setTimeout(() => {
      spotlight.classList.remove('active');
      setTimeout(onDone, 600);
    }, 10000);
  }

  function buildCard(photo, isNew) {
    const card = document.createElement('div');
    card.className = 'card' + (isNew ? ' new-card' : '');
    card.dataset.filename = photo.filename;

    const img = document.createElement('img');
    img.src = '/photo/' + encodeURIComponent(photo.filename);
    img.alt = 'Фото от ' + photo.name;
    img.loading = 'lazy';

    const cap = document.createElement('div');
    cap.className = 'caption';

    if (photo.caption) {
      const ct = document.createElement('div');
      ct.className = 'photo-caption';
      ct.textContent = '«' + photo.caption + '»';
      cap.appendChild(ct);
    }

    const meta = document.createElement('div');
    meta.className = 'caption-meta';
    const ns = document.createElement('span');
    ns.className = 'guest-name';
    ns.textContent = photo.name;
    const ts = document.createElement('span');
    ts.className = 'photo-time';
    ts.textContent = photo.time;
    meta.appendChild(ns); meta.appendChild(ts);
    cap.appendChild(meta);
    card.appendChild(img); card.appendChild(cap);

    if (isNew) {
      const badge = document.createElement('div');
      badge.className = 'badge-new';
      badge.textContent = '✨ Новое';
      card.appendChild(badge);
      setTimeout(() => { badge.remove(); card.classList.remove('new-card'); }, 15000);
    }
    return card;
  }

  // ═══════════════════════════════════════════════════════
  // РЕЖИМ КВИЗА — логика
  // ═══════════════════════════════════════════════════════
  const quizMode      = document.getElementById('quiz-mode');
  const questionView  = document.getElementById('question-view');
  const resultsView   = document.getElementById('results-view');
  const qProgress     = document.getElementById('q-progress');
  const progressFill  = document.getElementById('progress-fill');
  const quizQuestion  = document.getElementById('quiz-question');
  const lbRows        = document.getElementById('lb-rows');
  const answeredCount = document.getElementById('answered-count');
  const resultsRows   = document.getElementById('results-rows');

  // Предыдущее состояние — чтобы не перерисовывать без изменений
  let prevQuizStr   = '';
  // Таймер авто-возврата к фото после /results
  let resultsTimer  = null;

  const MEDALS = ['🥇', '🥈', '🥉'];

  async function fetchQuiz() {
    try {
      const res = await fetch('/quiz');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const state = await res.json();
      // Если активен режим слайдшоу — квиз не показываем
      if (slideshowEl && slideshowEl.classList.contains('visible')) return;
      const stateStr = JSON.stringify(state);
      if (stateStr === prevQuizStr) return;   // ничего не изменилось
      prevQuizStr = stateStr;
      renderQuiz(state);
    } catch (err) {
      console.error('Ошибка /quiz:', err);
    }
  }

  function renderQuiz(state) {
    const wasActive = !quizMode.classList.contains('visible');

    if (state.active) {
      // ── Режим АКТИВНОГО вопроса ──────────────────────────────────
      clearTimeout(resultsTimer);
      showQuizMode();

      questionView.style.display = 'flex';
      questionView.style.flexDirection = 'column';
      questionView.style.alignItems = 'center';
      resultsView.style.display  = 'none';

      // Прогресс
      const cur = state.current_question || 1;
      const tot = state.total_questions  || 1;
      qProgress.textContent = `Вопрос ${cur} из ${tot}`;
      progressFill.style.width = Math.round(cur / tot * 100) + '%';

      // Вопрос
      quizQuestion.textContent = state.question_text || '';

      // Лидерборд (топ-3)
      const top3 = (state.leaderboard || []).slice(0, 3);
      lbRows.innerHTML = '';
      if (top3.length === 0) {
        lbRows.innerHTML = '<div style="text-align:center;color:#555;padding:12px">Пока нет ответов</div>';
      } else {
        top3.forEach((entry, i) => {
          const rowClass = ['gold-row', 'silver-row', 'bronze-row'][i] || '';
          const answered = entry.total > 0 ? entry.total : cur - 1;
          const isLeader = i === 0 && entry.score === answered && answered > 0;
          lbRows.innerHTML += `
            <div class="lb-row ${rowClass}">
              <span class="lb-medal">${MEDALS[i] || (i + 1) + '.'}</span>
              <span class="lb-name">${escHtml(entry.name)}</span>
              <span class="lb-score">${entry.score} из ${answered}</span>
              ${isLeader ? '<span class="lb-spark">⚡</span>' : ''}
            </div>`;
        });
      }

      // Счётчик ответивших
      const ac = state.answered_count    || 0;
      const tp = state.total_participants || 0;
      answeredCount.innerHTML = `Ответили: <span>${ac}</span> из <span>${tp}</span>`;

    } else if (state.show_results) {
      // ── Режим ИТОГОВ ─────────────────────────────────────────────
      showQuizMode();
      questionView.style.display = 'none';
      resultsView.style.display  = 'block';

      const all = state.leaderboard || [];
      resultsRows.innerHTML = '';
      all.forEach((entry, i) => {
        const medal = MEDALS[i] || `${i + 1}.`;
        resultsRows.innerHTML += `
          <div class="results-row" style="--i:${i + 1}">
            <span class="results-medal">${medal}</span>
            <span class="results-name">${escHtml(entry.name)}</span>
            <span class="results-score">${entry.score} из ${entry.total}</span>
          </div>`;
      });

      // Через 30 секунд плавно вернуться к фото
      clearTimeout(resultsTimer);
      resultsTimer = setTimeout(hideQuizMode, 30000);

    } else {
      // ── Квиз не активен → режим ФОТО ─────────────────────────────
      if (quizMode.classList.contains('visible')) {
        hideQuizMode();
      }
    }
  }

  function showQuizMode() {
    quizMode.style.display = 'flex';
    // Небольшая задержка чтобы transition сработал после display:flex
    requestAnimationFrame(() => quizMode.classList.add('visible'));
    // Спотлайт прячем на время квиза
    spotlight.classList.remove('active');
    spotlightBusy = true;  // останавливаем карусель
  }

  function hideQuizMode() {
    quizMode.classList.remove('visible');
    setTimeout(() => {
      quizMode.style.display = 'none';
      spotlightBusy = false;   // возобновляем карусель
      processSpotlight();
    }, 650);
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ═══════════════════════════════════════════════════════
  // РЕЖИМ СЛАЙДШОУ — логика
  // ═══════════════════════════════════════════════════════
  const slideshowEl    = document.getElementById('slideshow-mode');
  const starSkyEl      = document.getElementById('starsky-mode');
  const presentationEl = document.getElementById('presentation-mode');
  const presFrameA     = document.getElementById('pres-a');
  const presFrameB     = document.getElementById('pres-b');
  const presCounter    = document.getElementById('presentation-counter');
  const presDots       = document.getElementById('presentation-dots');

  let presFiles  = [];
  let presIdx    = 0;
  let presActive = false;  // A=true, B=false
  let presPreload = new Image();

  function buildPresDots() {
    presDots.innerHTML = '';
    presFiles.forEach((_, i) => {
      const d = document.createElement('div');
      d.className = 'pres-dot' + (i === presIdx ? ' active' : '');
      presDots.appendChild(d);
    });
  }

  function updatePresCounter() {
    presCounter.textContent = `${presIdx + 1} / ${presFiles.length}`;
  }

  function showPresSlide(idx) {
    if (!presFiles.length) return;
    presIdx = (idx + presFiles.length) % presFiles.length;
    const url = `/presentation-photo/${presFiles[presIdx]}`;

    presPreload = new Image();
    presPreload.onload = () => {
      const next = presActive ? presFrameB : presFrameA;
      const curr = presActive ? presFrameA : presFrameB;
      next.style.backgroundImage = `url('${url}')`;
      next.classList.add('active');
      curr.classList.remove('active');
      presActive = !presActive;
    };
    presPreload.src = url;

    // Обновляем точки и счётчик
    presDots.querySelectorAll('.pres-dot').forEach((d, i) =>
      d.classList.toggle('active', i === presIdx)
    );
    updatePresCounter();
  }

  async function startPresentation() {
    try {
      const res = await fetch('/presentation-list');
      presFiles = await res.json();
    } catch (e) { presFiles = []; }
    if (!presFiles.length) return;

    presIdx = 0;
    presActive = false;
    presFrameA.style.backgroundImage = '';
    presFrameB.style.backgroundImage = '';
    presFrameA.classList.remove('active');
    presFrameB.classList.remove('active');

    buildPresDots();
    showPresSlide(0);

    presentationEl.style.display = 'flex';
    requestAnimationFrame(() => presentationEl.classList.add('visible'));
    spotlight.classList.remove('active');
    spotlightBusy = true;
  }

  function stopPresentation() {
    presentationEl.classList.remove('visible');
    setTimeout(() => { presentationEl.style.display = 'none'; }, 700);
    spotlightBusy = false;
  }

  // Клавиатурный обработчик для кликера
  document.addEventListener('keydown', (e) => {
    if (!presentationEl.classList.contains('visible')) return;
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(e.key)) {
      e.preventDefault();
      showPresSlide(presIdx + 1);
    } else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) {
      e.preventDefault();
      showPresSlide(presIdx - 1);
    }
  });
  const slideA       = document.getElementById('slide-a');
  const slideB       = document.getElementById('slide-b');
  const slideDots    = document.getElementById('slideshow-dots');

  let slideshowFiles   = [];   // список файлов из /preset-list
  let slideIdx         = 0;    // текущий индекс слайда
  let slideTimer       = null; // setInterval для авто-смены
  let slideActiveLayer = 'a';  // какой слой сейчас видим
  let prevModeStr      = '';   // для детекции изменений

  const SLIDE_INTERVAL = 5000; // 5 секунд на слайд

  async function fetchMode() {
    try {
      const res = await fetch('/mode');
      if (!res.ok) return;
      const data = await res.json();
      const modeStr = JSON.stringify(data);
      if (modeStr === prevModeStr) return;
      prevModeStr = modeStr;

      if (data.mode === 'starsky') {
        hideQuizMode(); stopSlideshow(); stopPresentation();
        starSkyEl.style.display = 'block';
        requestAnimationFrame(() => starSkyEl.classList.add('visible'));
      } else if (data.mode === 'presentation') {
        hideQuizMode(); stopSlideshow();
        starSkyEl.classList.remove('visible');
        setTimeout(() => { starSkyEl.style.display = 'none'; }, 700);
        await startPresentation();
      } else {
        starSkyEl.classList.remove('visible');
        setTimeout(() => { starSkyEl.style.display = 'none'; }, 1200);
        stopPresentation();
        if (data.mode === 'slideshow') {
          hideQuizMode();
          await startSlideshow();
        } else {
          stopSlideshow();
        }
      }
    } catch (e) {
      console.error('Ошибка /mode:', e);
    }
  }

  async function startSlideshow() {
    // Загружаем список файлов
    try {
      const res = await fetch('/preset-list');
      slideshowFiles = await res.json();
    } catch (e) {
      console.error('Ошибка /preset-list:', e);
      slideshowFiles = [];
    }

    if (slideshowFiles.length === 0) return; // нечего показывать

    // Показываем слой слайдшоу
    slideshowEl.style.display = 'flex';
    requestAnimationFrame(() => slideshowEl.classList.add('visible'));

    // Останавливаем спотлайт гостей
    spotlight.classList.remove('active');
    spotlightBusy = true;

    // Строим точки-индикаторы
    buildDots();

    // Показываем первый слайд сразу
    slideIdx = 0;
    showSlide(slideIdx);

    // Запускаем авто-смену
    clearInterval(slideTimer);
    slideTimer = setInterval(nextSlide, SLIDE_INTERVAL);
  }

  function stopSlideshow() {
    clearInterval(slideTimer);
    slideTimer = null;
    slideshowEl.classList.remove('visible');
    setTimeout(() => {
      slideshowEl.style.display = 'none';
    }, 700);

    // Возобновляем спотлайт гостей
    spotlightBusy = false;
    processSpotlight();
  }

  function buildDots() {
    slideDots.innerHTML = '';
    slideshowFiles.forEach((_, i) => {
      const d = document.createElement('div');
      d.className = 'slide-dot' + (i === 0 ? ' active' : '');
      slideDots.appendChild(d);
    });
  }

  function updateDots() {
    slideDots.querySelectorAll('.slide-dot').forEach((d, i) => {
      d.classList.toggle('active', i === slideIdx);
    });
  }

  function showSlide(idx) {
    if (slideshowFiles.length === 0) return;
    const url = '/preset/' + encodeURIComponent(slideshowFiles[idx]);

    // Кроссфейд: пишем в неактивный слой, потом меняем видимость
    if (slideActiveLayer === 'a') {
      // Готовим слой B
      slideB.style.backgroundImage = `url('${url}')`;
      // Ждём пока картинка загрузится
      const img = new Image();
      img.onload = () => {
        slideB.classList.add('active');
        slideA.classList.remove('active');
        slideActiveLayer = 'b';
        updateDots();
      };
      img.src = url;
    } else {
      // Готовим слой A
      slideA.style.backgroundImage = `url('${url}')`;
      const img = new Image();
      img.onload = () => {
        slideA.classList.add('active');
        slideB.classList.remove('active');
        slideActiveLayer = 'a';
        updateDots();
      };
      img.src = url;
    }
  }

  function nextSlide() {
    if (slideshowFiles.length === 0) return;
    slideIdx = (slideIdx + 1) % slideshowFiles.length;
    showSlide(slideIdx);
  }

  // ═══════════════════════════════════════════════════════
  // ОПРОСЫ И SSE
  // ═══════════════════════════════════════════════════════

  // Первый запрос сразу
  fetchPhotos();
  fetchQuiz();
  fetchMode();

  // SSE: мгновенное обновление при новом фото
  function connectSSE() {
    const es = new EventSource('/events');
    es.onmessage = e => { if (e.data === 'refresh') fetchPhotos(); };
    es.onerror   = () => { es.close(); setTimeout(connectSSE, 3000); };
  }
  connectSSE();

  // Резервный опрос каждые 3 секунды
  setInterval(fetchPhotos, 3000);
  setInterval(fetchQuiz,   3000);
  setInterval(fetchMode,   3000);
</script>
</body>
</html>
